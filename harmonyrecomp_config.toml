#
# b) Small functions referenced by pointers in .rdata/.data (vtables,
#    callback tables). Kept only if the target follows a return or padding
#    and ends in blr/bctr/b within 64 instructions.
0x822B8408 = {}
0x8239BDA0 = {}
0x824552C0 = {}
0x824B08D0 = {}
0x824EC6E8 = {}
0x8258B4F8 = {}
0x8259FF48 = {}
