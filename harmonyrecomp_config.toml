# harmonyrecomp - ReXGlue codegen config for Castlevania: Harmony of Despair (XBLA)
#
# Title ID 58410A7A, default.xex (original PE name dcHD_Master.exe),
# version 0x00000104, XDK libraries 2.0.9328.0, image 0x82000000-0x82960000.
#
# Add named functions (indirect-call targets), midasm hooks, and CRT
# addresses here once they are located in assets/default.xex.
#
# Example:
#   [functions]
#   0x8XXXXXXX = {name = "MyFunction"}
#
#   [[midasm_hook]]
#   address = 0x8XXXXXXX
#   name = "MyHook"
#   registers = ["r3"]
#   return = true
#
#   [rexcrt]
#   memcpy  = 0x8XXXXXXX
#   memset  = 0x8XXXXXXX
#   memmove = 0x8XXXXXXX

# XDK CRT memory routines, replaced with native host versions.
# memcpy  sub_8273A030 (1215 call sites): saves r3 for the return value, aligns
#         dst to 8 bytes with a byte loop, dcbt/dcbtst prefetch, ld/std block
#         copy, byte tail. No overlap check.
# memmove sub_8273AD00 (22 call sites): cmpw r3,r4 / beqlr / forward case is a
#         tail branch to memcpy 0x8273A030, otherwise a backward copy.
# memset  sub_8273A590 (610 call sites): byte stores up to 4-byte alignment,
#         then broadcasts the fill byte (rlwimi r4,r4,8,16,23 / 16,0,15) and
#         stores 16-byte blocks.
[rexcrt]
memcpy  = 0x8273A030
memmove = 0x8273AD00
memset  = 0x8273A590

[functions]
# C++ multiple-inheritance adjustor thunk (this -= 8, then tail-branch).
# Its neighbours 0x82644498 / 0x826444A0 / 0x826444B0 have the same shape and
# were found automatically; this one is only reached by the tail branch at
# 0x826444B4, so the first codegen pass left it unresolved.
0x826444A8 = {}

# sub_8277ECF0 ends where sub_8277EE40 (its own prologue, 6 bl call sites)
# begins. The over-long jump table below made the scanner extend it to
# 0x8277F134; fixing the table alone does not shrink the boundary.
0x8277ECF0 = { end = 0x8277EE40 }

# Functions only reachable through pointers, found by scanning the code gaps
# the first codegen pass left behind (first launch crashed with
# 'Call to invalid or unregistered function at guest address 0x822130A8').
#
# a) Compiler thunks, matched by instruction pattern:
#    vcall thunk     lwz rX,0(r3) ; lwz rY,N(rX) ; mtctr rY ; bctr
#    adjustor thunk  addi r3,r3,imm ; b target
#    They are called through member-function pointers built in code, so no
#    pointer to them exists in the data sections.
0x82213038 = {}
0x82213048 = {}
0x82213058 = {}
0x82213068 = {}
0x82213078 = {}
0x82213088 = {}
0x82213098 = {}
0x822130A8 = {}   # the address of the first launch crash
0x822130B8 = {}
0x825A7E40 = {}
0x825F5088 = {}
0x825F5098 = {}
0x825F50A8 = {}
0x825F50B8 = {}
0x825F50C8 = {}
0x82647CD0 = {}
0x82647CD8 = {}
0x8264C8A8 = {}
0x8264C8B0 = {}
0x8264C8B8 = {}
