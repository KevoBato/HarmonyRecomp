# sub_8277ECF0: byte-indexed jump table with no bounds check.
#   lwz r11,240(r3) ; addi r11,r11,-1        index = message type - 1
#   lbzx r0,(0x82068E90 + r11) ; r0 <<= 2    one byte per case
#   ctr = 0x8277ED38 + r0 ; bctr @ 0x8277ED34
# Without a bounds check codegen read past the table into the next function.
# The table has 16 entries (types 1..16); the bytes, read from guest memory at
# runtime, are
#   0C 0C 0C 0C 42 0C 0C 0C 0C 00 0C 0C 00 00 00 00
# 0x0C -> 0x8277ED68 (plain cleanup), 0x00 -> 0x8277ED38 (also releases the
# connection at +308), 0x42 -> 0x8277EE40 = sub_8277EE40 (tail call).
# An earlier hand-written version was off by one from entry 8 on, which sent
# type 12 (data received, no connection when the host sends to itself) to
# 0x8277ED38 and crashed with a null connection when hosting a session.
[[switch_tables]]
address = 0x8277ED34
register = 11
labels = [
  0x8277ED68, 0x8277ED68, 0x8277ED68, 0x8277ED68, # 0-3   types 1-4
  0x8277EE40, 0x8277ED68, 0x8277ED68, 0x8277ED68, # 4-7   types 5-8
  0x8277ED68, 0x8277ED38, 0x8277ED68, 0x8277ED68, # 8-11  types 9-12
  0x8277ED38, 0x8277ED38, 0x8277ED38, 0x8277ED38, # 12-15 types 13-16
]
