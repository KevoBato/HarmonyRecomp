# Builds HarmonyLauncher.exe (no game code or data involved) and attaches it to
# releases. Pushes and pull requests that touch the launcher get it as a build
# artifact.
name: launcher

on:
  push:
    paths: ["launcher/**", ".github/workflows/launcher.yml"]
  pull_request:
    paths: ["launcher/**", ".github/workflows/launcher.yml"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        run: dotnet publish launcher -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: HarmonyLauncher
          path: launcher/bin/Release/net10.0/win-x64/publish/HarmonyLauncher.exe
      - name: Attach to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" launcher/bin/Release/net10.0/win-x64/publish/HarmonyLauncher.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
