# Builds HarmonyLauncher.exe (no game code or data involved) for pushes and
# pull requests that touch the launcher, as a build artifact to download from
# the run's page. Releases get the full package instead (launcher + source +
# prebuilt SDK, scripts/make_launcher_package.py), uploaded by hand: the exe
# alone downloads the upstream source, which needs the launcher files merged.
name: launcher

on:
  push:
    paths: ["launcher/**", ".github/workflows/launcher.yml"]
  pull_request:
    paths: ["launcher/**", ".github/workflows/launcher.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Publish
        run: dotnet publish launcher -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: HarmonyLauncher
          path: launcher/bin/Release/net10.0/win-x64/publish/HarmonyLauncher.exe
